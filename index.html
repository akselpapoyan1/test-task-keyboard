<!doctype html>
<html lang="en" data-colorway="highlighter">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Indent 75 · A keyboard you'll want to hear</title>
    <meta
      name="description"
      content="A 75% mechanical keyboard with a gasket-mounted aluminium case and three switches tuned by ear. Hear them, type on it, build yours."
    />
    <link rel="canonical" href="%VITE_SITE_URL%/" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="theme-color" content="#d9dbdc" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0f1012" media="(prefers-color-scheme: dark)" />

    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Indent" />
    <meta property="og:title" content="Indent 75 · A keyboard you'll want to hear" />
    <meta
      property="og:description"
      content="Gasket-mounted, aluminium, three switches tuned by ear. Batch 02 reservations are open."
    />
    <meta property="og:url" content="%VITE_SITE_URL%/" />
    <meta property="og:image" content="%VITE_SITE_URL%/og-image.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta
      property="og:image:alt"
      content="The Indent 75 keyboard in its yellow and grey colourway"
    />
    <meta name="twitter:card" content="summary_large_image" />

    <script>
      // Before the first paint: theme, the colourway of a saved build, and whether to animate.
      ;(function () {
        var root = document.documentElement
        var colourways = ['highlighter', 'grapefruit', 'matcha', 'lavender']
        try {
          var saved = localStorage.getItem('theme')
          var dark = matchMedia('(prefers-color-scheme: dark)').matches
          root.dataset.theme = saved || (dark ? 'dark' : 'light')
          var build = JSON.parse(localStorage.getItem('indent-build') || 'null')
          if (build && colourways.indexOf(build.colorway) > -1)
            root.dataset.colorway = build.colorway
        } catch (e) {}
        if (!matchMedia('(prefers-reduced-motion: reduce)').matches) root.classList.add('motion')
      })()
    </script>
  </head>
  <body>
    <div id="root"><!--app-html--></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
